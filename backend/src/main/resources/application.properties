spring.application.name=campusconnect
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Secret and Expiration
campusconnect.jwt.secret=${JWT_SECRET:CampusConnectSecretKeyForJwtAuthenticationTokenGeneration2026SecureKey!}
campusconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
