# ==============================================================================
# CampusConnect - Production Configuration
# Active Profile: prod
# ==============================================================================

spring.application.name=campusconnect
server.port=${PORT:8080}

# HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Database Configuration (Environment variable driven with sensible defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:campusconnect_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Production Connection Pool
spring.datasource.hikari.pool-name=CampusConnect-HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Security & JWT Token Configuration
campusconnect.jwt.secret=${JWT_SECRET:CampusConnectProductionSecretKey2026MustBeAtLeast32BytesLongForHmacSha256Security!}
campusconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring AI / Cognitive Engine Configuration
# If AI_API_KEY is provided, external LLM endpoints can be queried;
# otherwise, CampusConnect's internal cognitive analytics engine operates seamlessly.
campusconnect.ai.api-key=${AI_API_KEY:}
campusconnect.ai.model=${AI_MODEL:gpt-4o-mini}

# Production Logging
logging.level.root=INFO
logging.level.com.example.campusconnect=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
