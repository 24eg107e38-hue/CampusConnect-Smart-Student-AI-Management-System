# Netlify configuration when deploying from the repository root
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA route fallback for React Router / Hash Navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
