spring.application.name=campusconnect
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Secret and Expiration
campusconnect.jwt.secret=CampusConnectSecretKeyForJwtAuthenticationTokenGeneration2026SecureKey!
campusconnect.jwt.expiration-ms=86400000
